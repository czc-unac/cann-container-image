name: release-cann-agent

# Half-automation companion of check_cann_release.yml: the daily bulletin
# monitor opens one "New CANN release detected: <version>" issue per
# uncovered version; the maintainer replies on that issue with
#   /release-cann <version>              (stable)
#   /release-cann <version> <x.y.Tn>     (beta, OBS link-id)
# and this workflow generates the release change-set, gates it, and pushes a
# branch to this repository. It deliberately stops there: the branch is based
# on the upstream release repository (Ascend/cann-container-image), so the
# maintainer opens the upstream PR from the compare link posted back on the
# issue. Nothing is ever published; building and pushing images stay manual
# workflow_dispatch exactly as before.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'CANN version, e.g. 9.3.0-beta.1'
        required: true
      link_id:
        description: 'OBS CANN x.y.Tn directory (beta only)'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: release-cann-agent
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  generate-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.issue.title,
                  'New CANN release detected: ') &&
       startsWith(github.event.comment.body, '/release-cann '))
    runs-on: ubuntu-latest
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      DISPATCH_VERSION: ${{ github.event.inputs.version }}
      DISPATCH_LINK_ID: ${{ github.event.inputs.link_id }}
      UPSTREAM_REPO: ${{ vars.RELEASE_UPSTREAM_REPO || 'Ascend/cann-container-image' }}
      UPSTREAM_REF: ${{ vars.RELEASE_UPSTREAM_REF || 'main' }}
      RELEASE_GIT_NAME: ${{ vars.RELEASE_GIT_NAME }}
      RELEASE_GIT_EMAIL: ${{ vars.RELEASE_GIT_EMAIL }}
    steps:
      - name: Parse /release-cann trigger
        id: args
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
            link_id="$DISPATCH_LINK_ID"
          else
            words=( $COMMENT_BODY )
            [ "${words[0]:-}" = "/release-cann" ] || exit 1
            version="${words[1]:-}"
            link_id="${words[2]:-}"
            # A trigger comment must target the version its issue tracks.
            title_version="${ISSUE_TITLE#New CANN release detected: }"
            if [ "$version" != "$title_version" ]; then
              echo "comment targets '$version' but this issue tracks" \
                   "'$title_version'; post the command on the right issue" >&2
              exit 1
            fi
          fi
          # Only validated tokens ever reach git/python argument lists.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "REJECT_VERSION" >&2
            echo "invalid version '$version' for auto-release; irregular names" \
                 "are handled with the release-cann-image skill manually" >&2
            exit 1
          fi
          if [[ "$version" == *-beta.* && ! "$link_id" =~ ^[0-9]+\.[0-9]+\.T[0-9]+$ ]]; then
            echo "beta releases need the OBS directory as second argument:" >&2
            echo "  /release-cann $version x.y.Tn" >&2
            exit 1
          fi
          if [[ "$version" != *-beta.* && -n "$link_id" ]]; then
            echo "stable releases must not carry a link-id" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "link_id=$link_id" >> "$GITHUB_OUTPUT"
          echo "branch=release-cann-$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # Every release change-set updates the four build/push workflow
          # ymls (their workflow_dispatch version lists), and GitHub refuses
          # to let the built-in GITHUB_TOKEN create or update workflow
          # files. RELEASE_PUSH_TOKEN is a fine-grained PAT scoped to this
          # repository with Contents and Workflows read+write.
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
          # A full fetch: the generated branch sits on top of upstream and
          # the push that follows must carry every object the fork lacks.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight - push token can touch workflow files
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::RELEASE_PUSH_TOKEN is not configured. Every release change-set updates .github/workflows/*, and GitHub never allows the built-in GITHUB_TOKEN to touch workflow files. Add a fine-grained PAT scoped to this repository with Contents: Read and write and Workflows: Read and write."
            exit 1
          fi

      - name: Prepare upstream state
        env:
          BRANCH: ${{ steps.args.outputs.branch }}
        run: |
          set -euo pipefail
          bash tools/prepare_upstream_state.sh \
            "https://github.com/$UPSTREAM_REPO.git" "$UPSTREAM_REF" "$BRANCH"

      - name: Generate the release change-set
        env:
          VERSION: ${{ steps.args.outputs.version }}
          LINK_ID: ${{ steps.args.outputs.link_id }}
        run: |
          set -euo pipefail
          gen_args=("$VERSION")
          [ -n "$LINK_ID" ] && gen_args+=(--link-id "$LINK_ID")
          python3 /tmp/cann-tools/gen_cann_release.py "${gen_args[@]}" \
            | tee /tmp/gen.log

      - name: Gate - stage only release-owned paths
        run: |
          set -euo pipefail
          release_paths=(
            tools/template.py
            build_cann_arg.json
            build_manylinux_arg.json
            cann_publish_version.json
            manylinux_publish_version.json
            OVERVIEW.md
            OVERVIEW.zh.md
            supported_tags.md
            .github/workflows/build_and_push_cann.yml
            .github/workflows/build_and_push_manylinux.yml
            .github/workflows/batch_build_and_push_cann.yml
            .github/workflows/batch_build_and_push_manylinux.yml
            cann
            manylinux
          )
          git add -A -- "${release_paths[@]}"
          git diff --cached --name-only > /tmp/staged
          if [ ! -s /tmp/staged ]; then
            echo "::error::the generator staged no changes; refusing to continue"
            exit 1
          fi
          if grep -v -E '^(tools/template\.py|build_(cann|manylinux)_arg\.json|cann_publish_version\.json|manylinux_publish_version\.json|OVERVIEW\.(md|zh\.md)|supported_tags\.md|\.github/workflows/(batch_)?build_and_push_(cann|manylinux)\.yml|cann/|manylinux/)' \
               /tmp/staged > /tmp/foreign; then
            echo "::error::staged paths outside the release allowlist:" >&2
            cat /tmp/foreign >&2
            exit 1
          fi
          git diff --cached --check
          echo "gate passed: $(wc -l < /tmp/staged) release files staged"

      - name: Gate - repository now covers the version
        env:
          VERSION: ${{ steps.args.outputs.version }}
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cann-tools python3 - "$VERSION" <<'PY'
          import sys
          from check_cann_release import is_known, known_tokens
          version = sys.argv[1]
          if not is_known(version, known_tokens()):
              sys.exit(f"{version} still not covered after generation")
          print(f"coverage gate passed for {version}")
          PY

      - name: Commit, push the branch and report the compare link
        id: release
        env:
          VERSION: ${{ steps.args.outputs.version }}
          LINK_ID: ${{ steps.args.outputs.link_id }}
          BRANCH: ${{ steps.args.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "${RELEASE_GIT_NAME:-$GITHUB_ACTOR}"
          git config user.email "${RELEASE_GIT_EMAIL:-$GITHUB_ACTOR@users.noreply.github.com}"
          git commit -s -m "Add CANN $VERSION images" -m \
          "Generated by tools/gen_cann_release.py${LINK_ID:+ with OBS link-id $LINK_ID}
          on top of $UPSTREAM_REPO@$UPSTREAM_REF, from the /release-cann trigger in
          run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          git push -f origin "$BRANCH"

          base="$(git rev-parse "$BRANCH^")"
          compare="$GITHUB_SERVER_URL/$UPSTREAM_REPO/compare/$UPSTREAM_REF...$GITHUB_REPOSITORY_OWNER:$BRANCH?expand=1&draft=1"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "files=$(wc -l < /tmp/staged)" >> "$GITHUB_OUTPUT"
          echo "compare=$compare" >> "$GITHUB_OUTPUT"
          echo "pushed $BRANCH at base $(git rev-parse --short "$base")"
          echo "compare link: $compare"

      - name: Report back to the notification issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.args.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch || steps.args.outputs.branch }}
          BASE: ${{ steps.release.outputs.base }}
          FILES: ${{ steps.release.outputs.files }}
          COMPARE: ${{ steps.release.outputs.compare }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ]; then
            body="Branch \`$BRANCH\` is ready in \`$GITHUB_REPOSITORY\` ($FILES files, based on \`$UPSTREAM_REPO@$UPSTREAM_REF\` at \`${BASE:0:12}\`).

          Open the upstream PR: $COMPARE

          Build/publish stay manual; merge upstream first, then run the batch workflow_dispatch."
          else
            body="Could not generate the release change-set for \`$VERSION\` this run ($RUN_URL).
          See the job log; irregular version naming or OBS gaps need the manual skill flow."
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "$body"
