name: Build and Push CANN A3 Image (arm64)

on:
  workflow_dispatch:

env:
  IMAGE: quay.io/canuunac/cann
  TAG: 9.0.1-a3-ubuntu22.04-py3.12-arm64
  DOCKERFILE: cann/9.0.1-a3-ubuntu22.04-py3.12/Dockerfile

jobs:
  build-and-push:
    name: Build and push ${{ env.IMAGE }}:${{ env.TAG }}
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
          ecr: false
          logout: false

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          provenance: false
